default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch('DATABASE_USERNAME', 'postgres') %>
  password: <%= ENV.fetch('DATABASE_PASSWORD', '1234') %>
  host: <%= ENV.fetch('DATABASE_HOST', 'localhost') %>     
  port: <%= ENV.fetch('DATABASE_PORT', 5432) %>           

development:
  <<: *default
  database: <%= ENV.fetch('DATABASE_NAME', 'auth_api_development') %>

test:
  <<: *default
  database: auth_api_test

production:
  <<: *default
  database: auth_api_production
  username: <%= ENV['AUTH_API_DATABASE_USER'] %>
  password: <%= ENV['AUTH_API_DATABASE_PASSWORD'] %>